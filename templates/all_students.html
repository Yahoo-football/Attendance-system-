<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>All Students</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
	<div class="container mx-auto p-6">
		<h1 class="text-2xl font-bold mb-4">All Registered Students</h1>

		<div class="bg-white rounded shadow p-4">
			<table class="min-w-full text-sm divide-y">
				<thead>
					<tr class="text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
						<th class="p-2">#</th>
						<th class="p-2">Photo</th>
						<th class="p-2">Name</th>
						<th class="p-2">Filename</th>
						<th class="p-2">Actions</th>
					</tr>
				</thead>
				<tbody id="studentsTable" class="bg-white divide-y">
					<!-- Rows inserted by JS -->
				</tbody>
			</table>
		</div>

		<div class="mt-4">
			<a href="/" class="text-blue-600 hover:underline">Back to Home</a>
		</div>
	</div>

	<script>
		async function loadStudents() {
			try {
				const res = await fetch('/registered_faces');
				const students = await res.json();
				const tbody = document.getElementById('studentsTable');
				if (!students.length) {
					tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">No registered students</td></tr>';
					return;
				}

				tbody.innerHTML = students.map((s, i) => `
					<tr>
						<td class="p-2 align-top">${i+1}</td>
						<td class="p-2 align-top">
							<img src="data:image/jpeg;base64,${s.image}" alt="${s.name}" class="w-20 h-20 object-cover rounded" />
						</td>
						<td class="p-2 align-top font-medium">${s.name}</td>
						<td class="p-2 align-top text-xs text-gray-600">${s.filename}</td>
						<td class="p-2 align-top">
							<button onclick="deleteStudent('${s.filename}')" class="px-3 py-1 bg-red-600 text-white rounded text-sm hover:bg-red-700">Delete</button>
						</td>
					</tr>
				`).join('');
			} catch (err) {
				console.error('Failed to load students', err);
			}
		}

		async function deleteStudent(filename) {
			if (!confirm('Delete ' + filename + '?')) return;
			try {
				const res = await fetch('/delete_registered_face', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({filename}) });
				const data = await res.json();
				if (data.success) loadStudents(); else alert('Delete failed');
			} catch (err) { console.error(err); alert('Delete failed'); }
		}

		loadStudents();
	</script>
</body>
</html>
