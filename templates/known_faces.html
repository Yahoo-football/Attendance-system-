<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Known Faces</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .face-card img { width: 100%; height: auto; border-radius: .5rem; }
        .face-card .card-title { margin-top: .5rem; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">

    <h1 class="mb-4 text-center">Registered People</h1>

    <div id="faces-grid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3">
        <!-- Cards will be injected here -->
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-outline-primary">Back to Camera</a>
    </div>
</div>

<script>
async function loadKnownFaces() {
    const resp = await fetch('/known_faces');
    const names = await resp.json();

    const grid = document.getElementById('faces-grid');
    grid.innerHTML = '';

    if (names.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center"><p class="text-muted">No one registered yet.</p></div>';
        return;
    }

    names.forEach(name => {
        const col = document.createElement('div');
        col.className = 'col';

        col.innerHTML = `
            <div class="card face-card h-100 shadow-sm">
                <img src="/static/photos/${encodeURIComponent(name)}.jpg" 
                     alt="${name}" 
                     loading="lazy"
                     onerror="this.src='https://via.placeholder.com/150?text=No+Photo';">
                <div class="card-body text-center p-2">
                    <h5 class="card-title mb-0">${name}</h5>
                </div>
            </div>`;
        grid.appendChild(col);
    });
}

window.addEventListener('DOMContentLoaded', loadKnownFaces);
</script>
</body>
</html>
